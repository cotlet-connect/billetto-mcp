[project]
name = "billetto-mcp"
version = "1.1.0"
description = "Connect Billetto to ChatGPT, Claude, Codex and Claude Code through Cotlet.dev, a hosted MCP server. No Billetto API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["billetto", "billetto api", "billetto mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/billetto-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=billetto"
Source = "https://github.com/cotlet-connect/billetto-mcp"

[project.scripts]
billetto-mcp = "billetto_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"billetto_agent.py" = "billetto_agent.py"

[tool.hatch.build.targets.sdist]
include = ["billetto_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
